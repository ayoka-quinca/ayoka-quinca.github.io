# Publie l'application sur GitHub Pages à chaque envoi sur la branche main.
# Réglage à faire une seule fois : Settings › Pages › Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer
        working-directory: app
        run: npm ci
      - name: Vérifier les types
        working-directory: app
        run: npm run typecheck
      - name: Construire
        working-directory: app
        run: |
          # Site à la racine seulement si le dépôt s'appelle « <propriétaire>.github.io » ;
          # sinon GitHub le publie sous /nom-du-depot/.
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "${REPO,,}" == "$OWNER.github.io" ]]; then export VITE_BASE=/; else export VITE_BASE="/$REPO/"; fi
          echo "Publication sous $VITE_BASE"
          npm run build
          # Les liens directs (ex : /stock) doivent ouvrir l'application, pas une erreur 404.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
