# Publie le site vitrine (racine) et l'application de gestion (/gestion/) à chaque envoi sur main.
# Réglage à faire une seule fois : Settings › Pages › Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer
        working-directory: app
        run: npm ci
      - name: Vérifier les types
        working-directory: app
        run: npm run typecheck
      - name: Construire le site et l'application
        run: |
          # Site à la racine seulement si le dépôt s'appelle « <propriétaire>.github.io » ;
          # sinon GitHub le publie sous /nom-du-depot/.
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "${REPO,,}" == "$OWNER.github.io" ]]; then PREFIX=/; else PREFIX="/$REPO/"; fi
          scripts/build-pages.sh "$PREFIX"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
