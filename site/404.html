<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable · AYOKA QUINCA</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <script>
    // Un lien direct vers l'application de gestion (ex : /gestion/stock) ouvre l'application.
    var i = location.pathname.indexOf('/gestion');
    if (i !== -1) location.replace(location.pathname.slice(0, i) + '/gestion/');
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4f2; color: #141414; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; }
    h1 { font: 400 2.6rem/1.1 Georgia, serif; margin: 18px 0 8px; }
    a { display: inline-block; margin-top: 18px; background: #f0601b; color: #fff; padding: 14px 24px; border-radius: 999px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.svg" alt="" width="64" height="64" style="margin:0 auto;border-radius:18px">
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être incomplet. Tous nos produits sont sur la page d'accueil.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
