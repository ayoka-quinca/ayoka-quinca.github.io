# Déploiement sur un VPS : application + HTTPS automatique (Caddy / Let's Encrypt).
# 1) Copier deploy/.env.example en deploy/.env et le remplir.
# 2) docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - ayoka-data:/data
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  ayoka-data:
  caddy-data:
